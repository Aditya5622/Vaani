<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaani - भारत की आवाज़</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tesseract.js for instant browser OCR (Camera text extraction) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #ff8a00;
            --accent-green: #10b981;
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.3);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #312e81, var(--bg-start) 60%),
                        linear-gradient(180deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }
        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 999px;
            font-size: 12px;
            color: var(--accent-green);
            font-weight: 600;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* 4 Main Action Cards */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .action-card {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-card.active {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.25), rgba(99, 102, 241, 0.05));
            border-color: var(--primary-light);
        }
        .action-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
        }
        .action-icon {
            font-size: 20px;
        }
        .action-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .action-card.active .action-label {
            color: #fff;
        }

        /* Language Switcher Bar */
        .lang-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 12px;
            gap: 8px;
        }
        .lang-select {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-align: center;
        }
        .lang-select option {
            background: #1e293b;
            color: #fff;
        }
        .swap-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--primary-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .swap-btn:hover {
            transform: rotate(180deg);
            background: var(--primary);
            color: #fff;
        }

        /* Input Card */
        .card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 90px;
        }
        textarea::placeholder {
            color: #64748b;
        }
        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .icon-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .icon-btn:hover {
            color: #fff;
            border-color: var(--primary-light);
        }

        /* Output Card */
        .output-card {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.08), rgba(15, 23, 42, 0.6));
            border-color: var(--border-glow);
        }
        .output-text {
            font-size: 17px;
            line-height: 1.5;
            min-height: 70px;
            color: #fff;
            font-weight: 500;
        }
        .output-placeholder {
            color: #64748b;
            font-style: italic;
        }

        /* Voice Mic Section */
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
            position: relative;
        }
        .mic-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 30px rgba(255, 138, 0, 0.4);
        }
        .mic-btn.recording {
            animation: recordPulse 1.2s infinite;
            background: linear-gradient(135deg, #ef4444, #f97316);
        }
        .mic-hint {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Translate Button */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes recordPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🎙️</div>
            <div>
                <h1>Vaani</h1>
                <p>Voice & AI Translator</p>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            Online
        </div>
    </div>

    <!-- Hidden Camera / File Input -->
    <input type="file" id="cameraFileInput" accept="image/*" style="display: none;">

    <!-- 4 Action Cards -->
    <div class="action-grid">
        <div class="action-card active" id="cardTranslate">
            <span class="action-icon">🌐</span>
            <span class="action-label">Translate</span>
        </div>
        <div class="action-card" id="cardSpeak">
            <span class="action-icon">🗣️</span>
            <span class="action-label">Speak</span>
        </div>
        <div class="action-card" id="cardListen">
            <span class="action-icon">👂</span>
            <span class="action-label">Listen</span>
        </div>
        <div class="action-card" id="cardCamera">
            <span class="action-icon">📷</span>
            <span class="action-label">Camera</span>
        </div>
    </div>

    <!-- Language Selector Bar -->
    <div class="lang-bar">
        <select id="sourceLang" class="lang-select">
            <option value="Hindi" selected>🇮🇳 Hindi</option>
            <option value="English">🇬🇧 English</option>
            <option value="Bengali">🇮🇳 Bengali</option>
            <option value="Gujarati">🇮🇳 Gujarati</option>
            <option value="Marathi">🇮🇳 Marathi</option>
            <option value="Tamil">🇮🇳 Tamil</option>
            <option value="Telugu">🇮🇳 Telugu</option>
            <option value="Urdu">🇮🇳 Urdu</option>
            <option value="Spanish">🇪🇸 Spanish</option>
            <option value="French">🇫🇷 French</option>
            <option value="German">🇩🇪 German</option>
            <option value="Japanese">🇯🇵 Japanese</option>
        </select>

        <button class="swap-btn" id="swapBtn" title="Swap Languages">⇄</button>

        <select id="targetLang" class="lang-select">
            <option value="English" selected>🇬🇧 English</option>
            <option value="Hindi">🇮🇳 Hindi</option>
            <option value="Bengali">🇮🇳 Bengali</option>
            <option value="Gujarati">🇮🇳 Gujarati</option>
            <option value="Marathi">🇮🇳 Marathi</option>
            <option value="Tamil">🇮🇳 Tamil</option>
            <option value="Telugu">🇮🇳 Telugu</option>
            <option value="Urdu">🇮🇳 Urdu</option>
            <option value="Spanish">🇪🇸 Spanish</option>
            <option value="French">🇫🇷 French</option>
            <option value="German">🇩🇪 German</option>
            <option value="Japanese">🇯🇵 Japanese</option>
        </select>
    </div>

    <!-- Source Input Card -->
    <div class="card">
        <div class="card-header">
            <span>INPUT TEXT</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea id="inputText" placeholder="यहाँ टाइप करें या नीचे माइक से बोलें..."></textarea>
        <div class="card-footer">
            <button class="icon-btn" id="clearBtn">🗑️ Clear</button>
            <button class="icon-btn" id="listenSourceBtn">🔊 Suno</button>
        </div>
    </div>

    <!-- Action / Translate Button -->
    <button class="btn-primary" id="translateBtn">
        <span>अनुवाद करें (Translate)</span>
        <span>→</span>
    </button>

    <!-- Output Card -->
    <div class="card output-card">
        <div class="card-header">
            <span>TRANSLATION RESULT</span>
            <button class="icon-btn" id="copyBtn" style="padding: 2px 8px;">📋 Copy</button>
        </div>
        <div id="outputText" class="output-text output-placeholder">
            अनुवाद यहाँ दिखाई देगा...
        </div>
        <div class="card-footer">
            <button class="icon-btn" id="speakResultBtn">🔊 Bol kar sunao</button>
        </div>
    </div>

    <!-- Floating Mic Action -->
    <div class="voice-section">
        <button class="mic-btn" id="micBtn" title="बोलने के लिए दबाएँ">
            🎙️
        </button>
        <span class="mic-hint" id="micStatus">बोलने के लिए माइक दबाएँ</span>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const listenSourceBtn = document.getElementById('listenSourceBtn');
    const charCount = document.getElementById('charCount');

    // Top 4 Action Cards
    const cardTranslate = document.getElementById('cardTranslate');
    const cardSpeak = document.getElementById('cardSpeak');
    const cardListen = document.getElementById('cardListen');
    const cardCamera = document.getElementById('cardCamera');
    const cameraFileInput = document.getElementById('cameraFileInput');
    const allCards = [cardTranslate, cardSpeak, cardListen, cardCamera];

    function setActiveCard(activeCard) {
        allCards.forEach(c => c.classList.remove('active'));
        activeCard.classList.add('active');
    }

    // Language Name to ISO Code Mapping
    const LANG_CODES = {
        "Hindi": "hi", "English": "en", "Bengali": "bn", "Gujarati": "gu",
        "Marathi": "mr", "Tamil": "ta", "Telugu": "te", "Urdu": "ur",
        "Spanish": "es", "French": "fr", "German": "de", "Japanese": "ja"
    };

    const SPEECH_LOCALES = {
        "Hindi": "hi-IN", "English": "en-US", "Bengali": "bn-IN", "Gujarati": "gu-IN",
        "Marathi": "mr-IN", "Tamil": "ta-IN", "Telugu": "te-IN", "Urdu": "ur-IN",
        "Spanish": "es-ES", "French": "fr-FR", "German": "de-DE", "Japanese": "ja-JP"
    };

    const OCR_LANG_CODES = {
        "Hindi": "hin", "English": "eng", "Bengali": "ben", "Gujarati": "guj",
        "Marathi": "mar", "Tamil": "tam", "Telugu": "tel", "Urdu": "urd",
        "Spanish": "spa", "French": "fra", "German": "deu", "Japanese": "jpn"
    };

    // Char counter
    inputText.addEventListener('input', () => {
        charCount.innerText = `${inputText.value.length} chars`;
    });

    // Swap Languages
    swapBtn.addEventListener('click', () => {
        const temp = sourceLang.value;
        sourceLang.value = targetLang.value;
        targetLang.value = temp;
        
        const tempText = inputText.value;
        if (outputText.innerText && !outputText.classList.contains('output-placeholder')) {
            inputText.value = outputText.innerText;
            outputText.innerText = tempText || 'अनुवाद यहाँ दिखाई देगा...';
            if (!tempText) outputText.classList.add('output-placeholder');
        }
    });

    // Clear
    clearBtn.addEventListener('click', () => {
        inputText.value = '';
        outputText.innerText = 'अनुवाद यहाँ दिखाई देगा...';
        outputText.classList.add('output-placeholder');
        charCount.innerText = '0 chars';
    });

    // Copy
    copyBtn.addEventListener('click', () => {
        if (!outputText.classList.contains('output-placeholder')) {
            navigator.clipboard.writeText(outputText.innerText);
            copyBtn.innerText = '✅ Copied!';
            setTimeout(() => copyBtn.innerText = '📋 Copy', 1500);
        }
    });

    // Direct Browser Translate API (No Render Server Rate Limit)
    translateBtn.addEventListener('click', async () => {
        const text = inputText.value.trim();
        if (!text) return;

        const sl = LANG_CODES[sourceLang.value] || 'hi';
        const tl = LANG_CODES[targetLang.value] || 'en';

        if (sl === tl) {
            outputText.classList.remove('output-placeholder');
            outputText.innerText = text;
            return;
        }

        translateBtn.innerHTML = '<span>अनुवाद हो रहा है...</span>';
        translateBtn.style.opacity = '0.7';

        try {
            const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(gtxUrl);
            
            if (res.ok) {
                const data = await res.json();
                const translated = data[0].map(item => item[0]).join('');
                outputText.classList.remove('output-placeholder');
                outputText.innerText = translated;
            } else {
                throw new Error('Direct API busy');
            }
        } catch (err) {
            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        source_lang: sl,
                        target_lang: tl
                    })
                });
                const data = await res.json();
                outputText.classList.remove('output-placeholder');
                outputText.innerText = data.translation || data.translated_text || data.result || 'अनुवाद उपलब्ध नहीं हो सका।';
            } catch (backendErr) {
                outputText.classList.remove('output-placeholder');
                outputText.innerText = 'अनुवाद में त्रुटि हुई। कृपया इंटरनेट जाँचें और दोबारा प्रयास करें।';
            }
        } finally {
            translateBtn.innerHTML = '<span>अनुवाद करें (Translate)</span><span>→</span>';
            translateBtn.style.opacity = '1';
        }
    });

    // Text to Speech (Instant Browser Speech + Backend /tts Fallback)
    let currentAudio = null;
    async function playAudio(text, langName) {
        if (!text || !text.trim()) return;
        const locale = SPEECH_LOCALES[langName] || 'en-US';
        const langCode = LANG_CODES[langName] || 'en';

        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        // 1. Try Server gTTS first (Works best on mobile phones for Hindi/Indian languages)
        try {
            const formData = new FormData();
            formData.append('text', text);
            formData.append('lang', langCode);
            const res = await fetch('/tts', { method: 'POST', body: formData });
            if (res.ok) {
                const blob = await res.blob();
                currentAudio = new Audio(URL.createObjectURL(blob));
                await currentAudio.play();
                return;
            }
        } catch (e) {
            console.warn('Server TTS fallback to browser:', e);
        }

        // 2. Fallback to Browser SpeechSynthesis
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = locale;
            window.speechSynthesis.speak(utterance);
        }
    }

    speakResultBtn.addEventListener('click', () => {
        if (!outputText.classList.contains('output-placeholder')) {
            playAudio(outputText.innerText, targetLang.value);
        }
    });

    listenSourceBtn.addEventListener('click', () => {
        playAudio(inputText.value, sourceLang.value);
    });

    // Speech Recognition (Webkit Speech API)
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            micStatus.innerText = 'सुन रहा हूँ... बोलिए';
        };

        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            inputText.value = transcript;
            charCount.innerText = `${transcript.length} chars`;
            micStatus.innerText = 'सुना गया! अब अनुवाद हो रहा है...';
            translateBtn.click();
        };

        recognition.onerror = () => {
            micBtn.classList.remove('recording');
            micStatus.innerText = 'माइक में आवाज़ नहीं आई, फिर दबाएँ';
        };

        recognition.onend = () => {
            micBtn.classList.remove('recording');
            if (micStatus.innerText === 'सुन रहा हूँ... बोलिए') {
                micStatus.innerText = 'बोलने के लिए माइक दबाएँ';
            }
        };
    }

    function startMicRecording() {
        if (!recognition) {
            alert('आपके ब्राउज़र में स्पीच रिकग्निशन सपोर्ट नहीं है। Google Chrome का इस्तेमाल करें।');
            return;
        }
        try {
            recognition.lang = SPEECH_LOCALES[sourceLang.value] || 'hi-IN';
            recognition.start();
        } catch (e) {
            recognition.stop();
        }
    }

    micBtn.addEventListener('click', startMicRecording);

    // --- TOP 4 ACTION CARDS CLICK HANDLERS ---

    // 1. Translate Card
    cardTranslate.addEventListener('click', () => {
        setActiveCard(cardTranslate);
        inputText.focus();
    });

    // 2. Speak Card (Triggers Mic)
    cardSpeak.addEventListener('click', () => {
        setActiveCard(cardSpeak);
        startMicRecording();
    });

    // 3. Listen Card (Speaks Translated Result or Input Text)
    cardListen.addEventListener('click', () => {
        setActiveCard(cardListen);
        if (!outputText.classList.contains('output-placeholder') && outputText.innerText.trim()) {
            playAudio(outputText.innerText, targetLang.value);
        } else if (inputText.value.trim()) {
            playAudio(inputText.value, sourceLang.value);
        } else {
            micStatus.innerText = 'सुनने के लिए पहले कुछ लिखें या बोलें';
        }
    });

    // 4. Camera Card (Opens Camera / Gallery & Extracts Text via OCR)
    cardCamera.addEventListener('click', () => {
        setActiveCard(cardCamera);
        cameraFileInput.click();
    });

    cameraFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        inputText.value = '';
        inputText.placeholder = '📷 फ़ोटो से टेक्स्ट पढ़ा जा रहा है (कृपया 5-10 सेकंड रुकें)...';
        micStatus.innerText = '📷 इमेज स्कैन हो रही है...';

        try {
            const ocrLang = OCR_LANG_CODES[sourceLang.value] || 'eng';
            const worker = await Tesseract.createWorker(ocrLang);
            const ret = await worker.recognize(file);
            await worker.terminate();

            const extracted = ret.data.text.trim();
            if (extracted) {
                inputText.value = extracted;
                charCount.innerText = `${extracted.length} chars`;
                micStatus.innerText = '✅ फ़ोटो से टेक्स्ट मिल गया! अनुवाद हो रहा है...';
                translateBtn.click();
            } else {
                inputText.placeholder = 'यहाँ टाइप करें या नीचे माइक से बोलें...';
                micStatus.innerText = '❌ फ़ोटो में साफ़ अक्षर नहीं दिखे, साफ़ फ़ोटो लें';
            }
        } catch (err) {
            console.error('OCR Error:', err);
            inputText.placeholder = 'यहाँ टाइप करें या नीचे माइक से बोलें...';
            micStatus.innerText = '❌ फ़ोटो स्कैन करने में समस्या आई';
        }
        cameraFileInput.value = '';
    });
</script>
</body>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaani Translator</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 540px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        header { background: #2563eb; color: #ffffff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        #install-btn { background: #ffffff; color: #2563eb; border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; }
        
        .lang-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-size: 14px; outline: none; }
        .swap-btn { background: none; border: none; font-size: 18px; margin: 0 10px; cursor: pointer; color: #64748b; }
        
        .box-container { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; background: #fff; }
        textarea { width: 100%; border: none; resize: none; font-size: 16px; outline: none; min-height: 100px; color: #334155; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .action-btns { display: flex; gap: 8px; }
        .icon-btn { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
        .icon-btn:hover { background: #e2e8f0; }
        .recording { background: #ef4444 !important; color: white !important; animation: pulse 1s infinite; }
        
        .translate-btn { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .translate-btn:active { transform: scale(0.98); }
        .status-msg { font-size: 13px; text-align: center; color: #64748b; margin-top: 4px; min-height: 18px; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>वाणी (Vaani)</h1>
        <button id="install-btn">📱 Install App</button>
    </header>

    <div class="lang-bar">
        <select id="source-lang">
            <option value="auto">Auto Detect</option>
            <option value="hi" selected>Hindi (हिन्दी)</option>
            <option value="en">English</option>
            <option value="bn">Bengali</option>
            <option value="mr">Marathi</option>
            <option value="te">Telugu</option>
            <option value="ta">Tamil</option>
            <option value="gu">Gujarati</option>
            <option value="ur">Urdu</option>
            <option value="pa">Punjabi</option>
        </select>

        <button class="swap-btn" id="swap-btn">⇄</button>

        <select id="target-lang">
            <option value="en" selected>English</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="bn">Bengali</option>
            <option value="mr">Marathi</option>
            <option value="te">Telugu</option>
            <option value="ta">Tamil</option>
            <option value="gu">Gujarati</option>
            <option value="ur">Urdu</option>
            <option value="pa">Punjabi</option>
        </select>
    </div>

    <div class="box-container">
        <!-- Input Card -->
        <div class="card">
            <textarea id="input-text" placeholder="यहाँ लिखें या माइक से बोलें..."></textarea>
            <div class="card-footer">
                <div class="action-btns">
                    <button class="icon-btn" id="mic-btn" title="बोलकर लिखें">🎙️</button>
                    <label class="icon-btn" title="कैमरा / फ़ाइल से फ़ोटो चुनें" style="cursor: pointer;">
                        📷
                        <input type="file" id="camera-input" accept="image/*" style="display: none;">
                    </label>
                </div>
                <button class="icon-btn" id="clear-btn" title="साफ़ करें">✕</button>
            </div>
        </div>

        <button class="translate-btn" id="translate-btn">Translate / अनुवाद करें</button>
        <div class="status-msg" id="status-msg"></div>

        <!-- Output Card -->
        <div class="card" style="background: #f8fafc;">
            <textarea id="output-text" placeholder="अनुवाद यहाँ दिखाई देगा..." readonly></textarea>
            <div class="card-footer">
                <div class="action-btns">
                    <button class="icon-btn" id="speak-btn" title="सुनें">🔊</button>
                    <button class="icon-btn" id="copy-btn" title="कॉपी करें">📋</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const inputText = document.getElementById('input-text');
    const outputText = document.getElementById('output-text');
    const sourceLang = document.getElementById('source-lang');
    const targetLang = document.getElementById('target-lang');
    const translateBtn = document.getElementById('translate-btn');
    const micBtn = document.getElementById('mic-btn');
    const speakBtn = document.getElementById('speak-btn');
    const copyBtn = document.getElementById('copy-btn');
    const clearBtn = document.getElementById('clear-btn');
    const swapBtn = document.getElementById('swap-btn');
    const cameraInput = document.getElementById('camera-input');
    const statusMsg = document.getElementById('status-msg');
    const installBtn = document.getElementById('install-btn');

    // 1. डायरेक्ट ट्रांसलेशन फ़ंक्शन (Server Rate-Limit Proof)
    async function translateNow() {
        const text = inputText.value.trim();
        if (!text) {
            statusMsg.innerText = "कृपया पहले कुछ लिखें या बोलें!";
            return;
        }

        const sl = sourceLang.value;
        const tl = targetLang.value;

        if (sl !== 'auto' && sl === tl) {
            outputText.value = text;
            return;
        }

        statusMsg.innerText = "अनुवाद हो रहा है...";
        translateBtn.disabled = true;

        try {
            // डायरेक्ट Google Client API (ब्राउज़र से सीधे, कोई ब्लॉक नहीं)
            const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(gtxUrl);
            
            if (res.ok) {
                const data = await res.json();
                const result = data[0].map(item => item[0]).join('');
                outputText.value = result;
                statusMsg.innerText = "✓ अनुवाद पूरा हुआ";
            } else {
                throw new Error("Direct request failed");
            }
        } catch (err) {
            // फ़ॉलबैक: सर्वर बैकएंड
            try {
                const sRes = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, source_lang: sl, target_lang: tl })
                });
                const sData = await sRes.json();
                outputText.value = sData.translated_text || sData.result || "";
                statusMsg.innerText = "✓ अनुवाद पूरा हुआ (सर्वर)";
            } catch (sErr) {
                statusMsg.innerText = "अनुवाद विफल हुआ। कृपया दोबारा प्रयास करें।";
            }
        } finally {
            translateBtn.disabled = false;
        }
    }

    translateBtn.addEventListener('click', translateNow);

    // 2. भाषा बदलने का बटन (Swap)
    swapBtn.addEventListener('click', () => {
        if (sourceLang.value === 'auto') return;
        const temp = sourceLang.value;
        sourceLang.value = targetLang.value;
        targetLang.value = temp;
        const tempText = inputText.value;
        inputText.value = outputText.value;
        outputText.value = tempText;
    });

    // 3. माइक (Speech-to-Text)
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            statusMsg.innerText = "बोलिए, आवाज़ रिकॉर्ड हो रही है...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            inputText.value = transcript;
            statusMsg.innerText = "आवाज़ दर्ज हो गई!";
            translateNow();
        };

        recognition.onerror = (e) => {
            micBtn.classList.remove('recording');
            statusMsg.innerText = "माइक एरर: अनुमति (Permission) दें या दोबारा दबाएँ";
        };

        recognition.onend = () => {
            micBtn.classList.remove('recording');
        };

        micBtn.addEventListener('click', () => {
            recognition.lang = sourceLang.value === 'auto' ? 'hi-IN' : (sourceLang.value === 'hi' ? 'hi-IN' : 'en-US');
            recognition.start();
        });
    } else {
        micBtn.addEventListener('click', () => {
            alert("आपके ब्राउज़र में स्पीच रिकॉग्निशन सपोर्ट नहीं है। कृपया Chrome यूज़ करें।");
        });
    }

    // 4. स्पीकर (Text-to-Speech)
    speakBtn.addEventListener('click', () => {
        const text = outputText.value.trim();
        if (!text) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang.value === 'hi' ? 'hi-IN' : 'en-US';
            window.speechSynthesis.speak(utterance);
        } else {
            alert("स्पीच सपोर्ट उपलब्ध नहीं है।");
        }
    });

    // 5. कॉपी और क्लियर बटन
    copyBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        navigator.clipboard.writeText(outputText.value);
        statusMsg.innerText = "✓ अनुवाद कॉपी हो गया!";
    });

    clearBtn.addEventListener('click', () => {
        inputText.value = "";
        outputText.value = "";
        statusMsg.innerText = "";
    });

    // 6. कैमरा / इमेज अपलोड हैंडलर
    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        statusMsg.innerText = "फ़ोटो चुनी गई: " + file.name;
    });

    // 7. PWA Install Banner Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });
</script>

</body>
</html>

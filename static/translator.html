<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaani - भारत की आवाज़</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #ff8a00;
            --accent-green: #10b981;
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.3);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #312e81, var(--bg-start) 60%),
                        linear-gradient(180deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }
        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 999px;
            font-size: 12px;
            color: var(--accent-green);
            font-weight: 600;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* 4 Main Action Cards */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .action-card {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-card.active {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.25), rgba(99, 102, 241, 0.05));
            border-color: var(--primary-light);
        }
        .action-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
        }
        .action-icon {
            font-size: 20px;
        }
        .action-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .action-card.active .action-label {
            color: #fff;
        }

        /* Language Switcher Bar */
        .lang-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 12px;
            gap: 8px;
        }
        .lang-select {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-align: center;
        }
        .lang-select option {
            background: #1e293b;
            color: #fff;
        }
        .swap-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--primary-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .swap-btn:hover {
            transform: rotate(180deg);
            background: var(--primary);
            color: #fff;
        }

        /* Input Card */
        .card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 90px;
        }
        textarea::placeholder {
            color: #64748b;
        }
        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .icon-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .icon-btn:hover {
            color: #fff;
            border-color: var(--primary-light);
        }

        /* Output Card */
        .output-card {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.08), rgba(15, 23, 42, 0.6));
            border-color: var(--border-glow);
        }
        .output-text {
            font-size: 17px;
            line-height: 1.5;
            min-height: 70px;
            color: #fff;
            font-weight: 500;
        }
        .output-placeholder {
            color: #64748b;
            font-style: italic;
        }

        /* Voice Mic Section */
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
            position: relative;
        }
        .mic-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 30px rgba(255, 138, 0, 0.4);
        }
        .mic-btn.recording {
            animation: recordPulse 1.2s infinite;
            background: linear-gradient(135deg, #ef4444, #f97316);
        }
        .mic-hint {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Translate Button */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes recordPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🎙️</div>
            <div>
                <h1>Vaani</h1>
                <p>Voice & AI Translator</p>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            Online
        </div>
    </div>

    <!-- 4 Action Cards -->
    <div class="action-grid">
        <div class="action-card active">
            <span class="action-icon">🌐</span>
            <span class="action-label">Translate</span>
        </div>
        <div class="action-card">
            <span class="action-icon">🗣️</span>
            <span class="action-label">Speak</span>
        </div>
        <div class="action-card">
            <span class="action-icon">👂</span>
            <span class="action-label">Listen</span>
        </div>
        <div class="action-card">
            <span class="action-icon">📷</span>
            <span class="action-label">Camera</span>
        </div>
    </div>

    <!-- Language Selector Bar -->
    <div class="lang-bar">
        <select id="sourceLang" class="lang-select">
            <option value="Hindi" selected>🇮🇳 Hindi</option>
            <option value="English">🇬🇧 English</option>
            <option value="Bengali">🇮🇳 Bengali</option>
            <option value="Gujarati">🇮🇳 Gujarati</option>
            <option value="Marathi">🇮🇳 Marathi</option>
            <option value="Tamil">🇮🇳 Tamil</option>
            <option value="Telugu">🇮🇳 Telugu</option>
            <option value="Urdu">🇮🇳 Urdu</option>
            <option value="Spanish">🇪🇸 Spanish</option>
            <option value="French">🇫🇷 French</option>
            <option value="German">🇩🇪 German</option>
            <option value="Japanese">🇯🇵 Japanese</option>
        </select>

        <button class="swap-btn" id="swapBtn" title="Swap Languages">⇄</button>

        <select id="targetLang" class="lang-select">
            <option value="English" selected>🇬🇧 English</option>
            <option value="Hindi">🇮🇳 Hindi</option>
            <option value="Bengali">🇮🇳 Bengali</option>
            <option value="Gujarati">🇮🇳 Gujarati</option>
            <option value="Marathi">🇮🇳 Marathi</option>
            <option value="Tamil">🇮🇳 Tamil</option>
            <option value="Telugu">🇮🇳 Telugu</option>
            <option value="Urdu">🇮🇳 Urdu</option>
            <option value="Spanish">🇪🇸 Spanish</option>
            <option value="French">🇫🇷 French</option>
            <option value="German">🇩🇪 German</option>
            <option value="Japanese">🇯🇵 Japanese</option>
        </select>
    </div>

    <!-- Source Input Card -->
    <div class="card">
        <div class="card-header">
            <span>INPUT TEXT</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea id="inputText" placeholder="यहाँ टाइप करें या नीचे माइक से बोलें..."></textarea>
        <div class="card-footer">
            <button class="icon-btn" id="clearBtn">🗑️ Clear</button>
            <button class="icon-btn" id="listenSourceBtn">🔊 Suno</button>
        </div>
    </div>

    <!-- Action / Translate Button -->
    <button class="btn-primary" id="translateBtn">
        <span>अनुवाद करें (Translate)</span>
        <span>→</span>
    </button>

    <!-- Output Card -->
    <div class="card output-card">
        <div class="card-header">
            <span>TRANSLATION RESULT</span>
            <button class="icon-btn" id="copyBtn" style="padding: 2px 8px;">📋 Copy</button>
        </div>
        <div id="outputText" class="output-text output-placeholder">
            अनुवाद यहाँ दिखाई देगा...
        </div>
        <div class="card-footer">
            <button class="icon-btn" id="speakResultBtn">🔊 Bol kar sunao</button>
        </div>
    </div>

    <!-- Floating Mic Action -->
    <div class="voice-section">
        <button class="mic-btn" id="micBtn" title="बोलने के लिए दबाएँ">
            🎙️
        </button>
        <span class="mic-hint" id="micStatus">बोलने के लिए माइक दबाएँ</span>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const listenSourceBtn = document.getElementById('listenSourceBtn');
    const charCount = document.getElementById('charCount');

    // Char counter
    inputText.addEventListener('input', () => {
        charCount.innerText = `${inputText.value.length} chars`;
    });

    // Swap Languages
    swapBtn.addEventListener('click', () => {
        const temp = sourceLang.value;
        sourceLang.value = targetLang.value;
        targetLang.value = temp;
        
        const tempText = inputText.value;
        if (outputText.innerText && !outputText.classList.contains('output-placeholder')) {
            inputText.value = outputText.innerText;
            outputText.innerText = tempText || 'अनुवाद यहाँ दिखाई देगा...';
            if (!tempText) outputText.classList.add('output-placeholder');
        }
    });

    // Clear
    clearBtn.addEventListener('click', () => {
        inputText.value = '';
        outputText.innerText = 'अनुवाद यहाँ दिखाई देगा...';
        outputText.classList.add('output-placeholder');
        charCount.innerText = '0 chars';
    });

    // Copy
    copyBtn.addEventListener('click', () => {
        if (!outputText.classList.contains('output-placeholder')) {
            navigator.clipboard.writeText(outputText.innerText);
            copyBtn.innerText = '✅ Copied!';
            setTimeout(() => copyBtn.innerText = '📋 Copy', 1500);
        }
    });

    // Translate API Call
    translateBtn.addEventListener('click', async () => {
        const text = inputText.value.trim();
        if (!text) return;

        translateBtn.innerHTML = '<span>अनुवाद हो रहा है...</span>';
        translateBtn.style.opacity = '0.7';

        try {
            const res = await fetch('/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    source: sourceLang.value,
                    target: targetLang.value
                })
            });
            const data = await res.json();
            
            outputText.classList.remove('output-placeholder');
            outputText.innerText = data.translation || data.translated_text || data.result || JSON.stringify(data);
        } catch (err) {
            outputText.classList.remove('output-placeholder');
            outputText.innerText = 'अनुवाद में त्रुटि हुई। कृपया दोबारा प्रयास करें।';
        } finally {
            translateBtn.innerHTML = '<span>अनुवाद करें (Translate)</span><span>→</span>';
            translateBtn.style.opacity = '1';
        }
    });

    // Text to Speech
    async function playAudio(text, lang) {
        if (!text) return;
        try {
            const res = await fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, language: lang })
            });
            const blob = await res.blob();
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            audio.play();
        } catch (e) {
            // Browser Web Speech fallback
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    speakResultBtn.addEventListener('click', () => {
        if (!outputText.classList.contains('output-placeholder')) {
            playAudio(outputText.innerText, targetLang.value);
        }
    });

    listenSourceBtn.addEventListener('click', () => {
        playAudio(inputText.value, sourceLang.value);
    });

    // Speech Recognition (Webkit Speech API)
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            micStatus.innerText = 'सुन रहा हूँ... बोलिए';
        };

        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            inputText.value = transcript;
            charCount.innerText = `${transcript.length} chars`;
            micStatus.innerText = 'सुना गया! अब अनुवाद करें।';
            translateBtn.click();
        };

        recognition.onerror = () => {
            micBtn.classList.remove('recording');
            micStatus.innerText = 'माइक में आवाज़ नहीं आई, फिर दबाएँ';
        };

        recognition.onend = () => {
            micBtn.classList.remove('recording');
            if (micStatus.innerText === 'सुन रहा हूँ... बोलिए') {
                micStatus.innerText = 'बोलने के लिए माइक दबाएँ';
            }
        };
    }

    micBtn.addEventListener('click', () => {
        if (!recognition) {
            alert('आपके ब्राउज़र में स्पीच रिकग्निशन सपोर्ट नहीं है। Google Chrome का इस्तेमाल करें।');
            return;
        }
        try {
            recognition.lang = sourceLang.value.toLowerCase().includes('hindi') ? 'hi-IN' : 'en-US';
            recognition.start();
        } catch (e) {
            recognition.stop();
        }
    });
</script>
</body>
</html>

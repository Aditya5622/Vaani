<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vaani - Voice Translator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #222;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .language-box {
            display: flex;
            gap: 15px;
            align-items: end;
            margin-bottom: 20px;
        }

        .language-box div {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .swap-btn {
            width: auto;
            margin: 0;
            padding: 11px 18px;
            background: #f59e0b;
            color: white;
        }

        .translate-btn {
            background: #2563eb;
            color: white;
        }

        .voice-btn {
            background: #16a34a;
            color: white;
        }

        .automatic-btn {
            background: #7c3aed;
            color: white;
        }

        .conversation-btn {
            background: #0891b2;
            color: white;
        }

        .stop-btn {
            background: #dc2626;
            color: white;
            display: none;
        }

        .clear-btn {
            background: #555;
            color: white;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        #translationResult {
            font-size: 18px;
            min-height: 30px;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }

        .conversation-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #ecfeff;
            border: 1px solid #a5f3fc;
        }

        .conversation-box h2 {
            margin-top: 0;
            text-align: center;
        }

        .conversation-message {
            background: white;
            margin-top: 12px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .person-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .original {
            color: #555;
        }

        .translated {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .language-box {
                flex-direction: column;
                align-items: stretch;
            }

            .swap-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎙️ Vaani</h1>

    <div class="subtitle">
        Voice Translator
    </div>


    <!-- Language Selection -->

    <div class="language-box">

        <div>

            <label for="sourceLanguage">
                Source Language
            </label>

            <select id="sourceLanguage">

                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="ja">Japanese</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="bn">Bengali</option>
                <option value="gu">Gujarati</option>
                <option value="mr">Marathi</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="ur">Urdu</option>

            </select>

        </div>


        <button
            class="swap-btn"
            onclick="swapLanguages()"
        >
            🔄 Swap
        </button>


        <div>

            <label for="targetLanguage">
                Target Language
            </label>

            <select id="targetLanguage">

                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ja">Japanese</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="bn">Bengali</option>
                <option value="gu">Gujarati</option>
                <option value="mr">Marathi</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="ur">Urdu</option>

            </select>

        </div>

    </div>


    <!-- Text Input -->

    <label for="textInput">
        Text
    </label>

    <textarea
        id="textInput"
        placeholder="यहाँ text लिखें या voice से बोलें..."
    ></textarea>


    <!-- Buttons -->

    <button
        class="translate-btn"
        onclick="translateText()"
    >
        🌐 Translate
    </button>


    <button
        class="voice-btn"
        onclick="speakText()"
    >
        🔊 Speak Translation
    </button>


    <button
        class="automatic-btn"
        onclick="startAutomaticVaani()"
    >
        🎤 Voice Translate
    </button>


    <button
        class="conversation-btn"
        onclick="startConversation()"
    >
        🗣️ Conversation Mode
    </button>


    <button
        id="stopConversationBtn"
        class="stop-btn"
        onclick="stopConversation()"
    >
        ⏹️ Stop Conversation
    </button>


    <button
        class="clear-btn"
        onclick="clearAll()"
    >
        🗑️ Clear
    </button>


    <!-- Status -->

    <div id="status">
        Ready
    </div>


    <!-- Translation Result -->

    <div class="result-box">

        <div class="result-title">
            Translation Result
        </div>

        <div id="translationResult">
            यहाँ translation दिखाई देगा।
        </div>

        <audio
            id="audioPlayer"
            controls
            style="display:none;"
        ></audio>

    </div>


    <!-- Conversation -->

    <div
        id="conversationBox"
        class="conversation-box"
    >

        <h2>
            🗣️ Conversation
        </h2>

        <div id="conversationMessages"></div>

    </div>

</div>


<script>

let recognition = null;

let conversationActive = false;


/* =========================
   TRANSLATE
========================= */

async function translateText() {

    const text =
        document.getElementById("textInput").value.trim();

    const source =
        document.getElementById("sourceLanguage").value;

    const target =
        document.getElementById("targetLanguage").value;


    if (!text) {

        alert("पहले text लिखें।");

        return;
    }


    document.getElementById("status").innerText =
        "🔄 Translation हो रहा है...";


    try {

        const response = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                text: text,
                source: source,
                target: target

            })

        });


        const data =
            await response.json();


        if (data.error) {

            document.getElementById("status").innerText =
                "❌ " + data.error;

            return;
        }


        document.getElementById(
            "translationResult"
        ).innerText =
            data.translated_text;


        document.getElementById("status").innerText =
            "✅ Translation complete";

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "❌ Translation में समस्या हुई।";

    }

}



/* =========================
   SPEAK
========================= */

async function speakText() {

    const text =
        document.getElementById(
            "translationResult"
        ).innerText.trim();

    const language =
        document.getElementById(
            "targetLanguage"
        ).value;


    if (!text ||
        text === "यहाँ translation दिखाई देगा।") {

        alert("पहले translation करें।");

        return;
    }


    document.getElementById("status").innerText =
        "🔊 Voice बनाई जा रही है...";


    try {

        const response =
            await fetch("/speak", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    text: text,
                    language: language

                })

            });


        const data =
            await response.json();


        const audioPlayer =
            document.getElementById(
                "audioPlayer"
            );


        audioPlayer.src =
            "/static/" +
            data.file +
            "?time=" +
            Date.now();


        audioPlayer.style.display =
            "block";


        await audioPlayer.play();


        document.getElementById("status").innerText =
            "🔊 Vaani बोल रहा है...";

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "❌ Voice में समस्या हुई।";

    }

}



/* =========================
   VOICE TRANSLATE
========================= */

function startAutomaticVaani() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Google Chrome इस्तेमाल करें।"
        );

        return;
    }


    recognition =
        new SpeechRecognition();


    const source =
        document.getElementById(
            "sourceLanguage"
        ).value;


    const target =
        document.getElementById(
            "targetLanguage"
        ).value;


    const speechLanguages = {

        hi: "hi-IN",
        en: "en-US",
        ja: "ja-JP",
        fr: "fr-FR",
        de: "de-DE",
        es: "es-ES",
        it: "it-IT",
        pt: "pt-PT",
        ru: "ru-RU",
        ko: "ko-KR",
        zh: "zh-CN",
        ar: "ar-SA",
        bn: "bn-IN",
        gu: "gu-IN",
        mr: "mr-IN",
        ta: "ta-IN",
        te: "te-IN",
        ur: "ur-PK"

    };


    recognition.lang =
        speechLanguages[source] ||
        "hi-IN";


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    document.getElementById("status").innerText =
        "🎤 सुन रहा हूँ... बोलिए";


    recognition.start();


    recognition.onresult =
        async function(event) {

            const speechText =
                event.results[0][0]
                    .transcript;


            document.getElementById(
                "textInput"
            ).value =
                speechText;


            await translateAndSpeak(
                speechText,
                source,
                target
            );

        };


    recognition.onerror =
        function(event) {

            console.error(event.error);

            document.getElementById(
                "status"
            ).innerText =
                "❌ Voice error: " +
                event.error;

        };

}



/* =========================
   TRANSLATE + SPEAK
========================= */

async function translateAndSpeak(
    text,
    source,
    target
) {

    try {

        document.getElementById(
            "status"
        ).innerText =
            "🔄 Translation हो रहा है...";


        const response =
            await fetch("/translate", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    text: text,
                    source: source,
                    target: target

                })

            });


        const data =
            await response.json();


        if (!data.translated_text) {

            return;

        }


        document.getElementById(
            "translationResult"
        ).innerText =
            data.translated_text;


        document.getElementById(
            "status"
        ).innerText =
            "🔊 Voice बनाई जा रही है...";


        const voiceResponse =
            await fetch("/speak", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    text:
                        data.translated_text,

                    language:
                        target

                })

            });


        const voiceData =
            await voiceResponse.json();


        const audioPlayer =
            document.getElementById(
                "audioPlayer"
            );


        audioPlayer.src =
            "/static/" +
            voiceData.file +
            "?time=" +
            Date.now();


        audioPlayer.style.display =
            "block";


        await audioPlayer.play();


        document.getElementById(
            "status"
        ).innerText =
            "✅ Translation + Voice complete";

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "❌ Error";

    }

}



/* =========================
   CONVERSATION MODE
========================= */

function startConversation() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Google Chrome इस्तेमाल करें।"
        );

        return;

    }


    conversationActive = true;


    document.getElementById(
        "conversationBox"
    ).style.display =
        "block";


    document.getElementById(
        "stopConversationBtn"
    ).style.display =
        "block";


    document.getElementById(
        "status"
    ).innerText =
        "🗣️ Conversation Mode शुरू हो गया";


    listenConversation();

}



/* =========================
   LISTEN CONVERSATION
========================= */

function listenConversation() {

    if (!conversationActive) {
        return;
    }


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    const source =
        document.getElementById(
            "sourceLanguage"
        ).value;


    const target =
        document.getElementById(
            "targetLanguage"
        ).value;


    const speechLanguages = {

        hi: "hi-IN",
        en: "en-US",
        ja: "ja-JP",
        fr: "fr-FR",
        de: "de-DE",
        es: "es-ES",
        it: "it-IT",
        pt: "pt-PT",
        ru: "ru-RU",
        ko: "ko-KR",
        zh: "zh-CN",
        ar: "ar-SA",
        bn: "bn-IN",
        gu: "gu-IN",
        mr: "mr-IN",
        ta: "ta-IN",
        te: "te-IN",
        ur: "ur-PK"

    };


    recognition.lang =
        speechLanguages[source] ||
        "hi-IN";


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    document.getElementById(
        "status"
    ).innerText =
        "🎤 बोलिए...";


    recognition.start();


    recognition.onresult =
        async function(event) {

            const speechText =
                event.results[0][0]
                    .transcript;


            addConversationMessage(
                "आप",
                speechText,
                "Translation हो रही है..."
            );


            try {

                const response =
                    await fetch("/translate", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            text:
                                speechText,

                            source:
                                source,

                            target:
                                target

                        })

                    });


                const data =
                    await response.json();


                if (!data.translated_text) {

                    return;

                }


                updateLastTranslation(
                    data.translated_text
                );


                const voiceResponse =
                    await fetch("/speak", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            text:
                                data.translated_text,

                            language:
                                target

                        })

                    });


                const voiceData =
                    await voiceResponse.json();


                const audioPlayer =
                    document.getElementById(
                        "audioPlayer"
                    );


                audioPlayer.src =
                    "/static/" +
                    voiceData.file +
                    "?time=" +
                    Date.now();


                audioPlayer.style.display =
                    "block";


                await audioPlayer.play();


                if (conversationActive) {

                    setTimeout(
                        listenConversation,
                        500
                    );

                }

            }

            catch (error) {

                console.error(error);

                if (conversationActive) {

                    setTimeout(
                        listenConversation,
                        1000
                    );

                }

            }

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Conversation error:",
                event.error
            );


            if (conversationActive) {

                setTimeout(
                    listenConversation,
                    1000
                );

            }

        };


    recognition.onend =
        function() {

            if (
                conversationActive &&
                !recognition
            ) {

                listenConversation();

            }

        };

}



/* =========================
   ADD MESSAGE
========================= */

function addConversationMessage(
    person,
    original,
    translated
) {

    const box =
        document.getElementById(
            "conversationMessages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "conversation-message";


    message.innerHTML = `

        <div class="person-name">
            ${person}
        </div>

        <div class="original">
            📝 ${original}
        </div>

        <div class="translated">
            🌐 ${translated}
        </div>

    `;


    box.appendChild(message);

}



/* =========================
   UPDATE LAST TRANSLATION
========================= */

function updateLastTranslation(
    translated
) {

    const box =
        document.getElementById(
            "conversationMessages"
        );


    const messages =
        box.getElementsByClassName(
            "conversation-message"
        );


    if (messages.length === 0) {
        return;
    }


    const lastMessage =
        messages[messages.length - 1];


    const translatedDiv =
        lastMessage.querySelector(
            ".translated"
        );


    translatedDiv.innerText =
        "🌐 " + translated;

}



/* =========================
   STOP CONVERSATION
========================= */

function stopConversation() {

    conversationActive =
        false;


    if (recognition) {

        recognition.stop();

        recognition = null;

    }


    document.getElementById(
        "stopConversationBtn"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).innerText =
        "⏹️ Conversation stopped";

}



/* =========================
   SWAP
========================= */

function swapLanguages() {

    const source =
        document.getElementById(
            "sourceLanguage"
        );


    const target =
        document.getElementById(
            "targetLanguage"
        );


    const oldSource =
        source.value;


    source.value =
        target.value;


    target.value =
        oldSource;


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Languages swapped";

}



/* =========================
   CLEAR
========================= */

function clearAll() {

    document.getElementById(
        "textInput"
    ).value =
        "";


    document.getElementById(
        "translationResult"
    ).innerText =
        "यहाँ translation दिखाई देगा।";


    const audioPlayer =
        document.getElementById(
            "audioPlayer"
        );


    audioPlayer.pause();

    audioPlayer.src = "";

    audioPlayer.style.display =
        "none";


    document.getElementById(
        "conversationMessages"
    ).innerHTML =
        "";


    document.getElementById(
        "conversationBox"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).innerText =
        "Ready";

}

</script>

</body>

</html>
